# Online saves commit to main. Local mode is enabled only by editor.js on localhost.
backend:
  name: github
  repo: Chen017/Blog
  branch: main
  base_url: https://www.etalib.space
  auth_endpoint: oauth
site_url: https://www.etalib.space
display_url: https://www.etalib.space
locale: zh_Hans
media_folder: public/assets/images
public_folder: /assets/images
collections:
  - name: posts
    label: 文章
    label_singular: 文章
    description: 默认使用 Markdown 源码；普通文章也可切换富文本，高级语法保持源码编辑。
    folder: src/content/posts
    create: true
    format: yaml-frontmatter
    path: '{{slug}}/index'
    slug: '{{slug}}'
    media_folder: ''
    public_folder: ''
    summary: '{{title}}'
    preview_path: posts/{{dirname}}/
    sortable_fields:
      - published
      - title
    fields:
      - label: 标题
        name: title
        widget: string
        required: true
      - label: 简短标题
        name: directoryTitle
        widget: string
        required: false
        hint: 用于目录和列表；留空则使用标题。
      - label: 发布日期
        name: published
        widget: datetime
        required: true
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: 更新日期
        name: updated
        widget: datetime
        required: false
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: 摘要
        name: description
        widget: text
        required: false
      - label: 分类
        name: category
        widget: string
        required: false
      - label: 封面
        name: cover
        widget: image
        required: false
      - label: 正文显示封面
        name: coverInContent
        widget: boolean
        required: false
        default: false
      - label: 置顶
        name: pinned
        widget: boolean
        required: false
        default: false
      - label: 草稿
        name: draft
        widget: boolean
        required: false
        default: true
        hint: 打开时文章不会出现在公开网站中。关闭后发布才能上线。
      - label: 文章语言
        name: lang
        widget: string
        required: false
        hint: 可留空；例如中文文章填写 zh-CN，用于页面语言标记。
      - label: 固定地址
        name: routeName
        widget: string
        required: false
        hint: 通常留空。已有文章修改标题不会改变原来的文件地址。
      - label: 允许评论
        name: comment
        widget: boolean
        required: false
        default: false
        hint: 默认关闭；网站全局评论开关当前也关闭。
      - label: 密码保护
        name: encrypted
        widget: boolean
        required: false
        default: false
      - label: 文章密码
        name: password
        widget: string
        required: false
      - label: 复制限制
        name: copyProtection
        widget: object
        required: false
        collapsed: true
        fields:
          - label: 禁止选择
            name: blockSelection
            widget: boolean
            required: false
            default: false
          - label: 禁止复制
            name: blockClipboard
            widget: boolean
            required: false
            default: false
          - label: 禁止右键菜单
            name: blockContextMenu
            widget: boolean
            required: false
            default: false
          - label: 限制开发者工具
            name: blockDevTools
            widget: boolean
            required: false
            default: false
      - label: 正文
        name: body
        widget: safe-markdown
        required: true
        hint: 可用“常用组件”表单插入图片、歌曲、提示框、公式和 Mermaid；高级语法自动使用源码编辑。
        fields:
          - name: component_cover
            label: 歌曲封面
            widget: image
            required: false
            media_folder: /public/assets/media
            public_folder: /assets/media
          - name: component_audio
            label: 歌曲音频
            widget: file
            required: false
            media_folder: /public/assets/media
            public_folder: /assets/media
          - name: component_image
            label: 正文图片
            widget: image
            required: false
            media_folder: ''
            public_folder: ''
    extension: md
  - name: mdx
    label: MDX 文章
    label_singular: MDX 文章
    description: 默认可视化编辑文字和图片，自动保留导入及图片布局；特殊组件保留为独立区块。
    folder: src/content/posts
    create: true
    format: yaml-frontmatter
    path: '{{slug}}/index'
    slug: '{{slug}}'
    media_folder: ''
    public_folder: ''
    summary: '{{title}}'
    preview_path: posts/{{dirname}}/
    sortable_fields:
      - published
      - title
    fields:
      - label: 标题
        name: title
        widget: string
        required: true
      - label: 简短标题
        name: directoryTitle
        widget: string
        required: false
        hint: 用于目录和列表；留空则使用标题。
      - label: 发布日期
        name: published
        widget: datetime
        required: true
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: 更新日期
        name: updated
        widget: datetime
        required: false
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: 摘要
        name: description
        widget: text
        required: false
      - label: 分类
        name: category
        widget: string
        required: false
      - label: 封面
        name: cover
        widget: image
        required: false
      - label: 正文显示封面
        name: coverInContent
        widget: boolean
        required: false
        default: false
      - label: 置顶
        name: pinned
        widget: boolean
        required: false
        default: false
      - label: 草稿
        name: draft
        widget: boolean
        required: false
        default: true
        hint: 打开时文章不会出现在公开网站中。关闭后发布才能上线。
      - label: 文章语言
        name: lang
        widget: string
        required: false
        hint: 可留空；例如中文文章填写 zh-CN，用于页面语言标记。
      - label: 固定地址
        name: routeName
        widget: string
        required: false
        hint: 通常留空。已有文章修改标题不会改变原来的文件地址。
      - label: 允许评论
        name: comment
        widget: boolean
        required: false
        default: false
        hint: 默认关闭；网站全局评论开关当前也关闭。
      - label: 密码保护
        name: encrypted
        widget: boolean
        required: false
        default: false
      - label: 文章密码
        name: password
        widget: string
        required: false
      - label: 复制限制
        name: copyProtection
        widget: object
        required: false
        collapsed: true
        fields:
          - label: 禁止选择
            name: blockSelection
            widget: boolean
            required: false
            default: false
          - label: 禁止复制
            name: blockClipboard
            widget: boolean
            required: false
            default: false
          - label: 禁止右键菜单
            name: blockContextMenu
            widget: boolean
            required: false
            default: false
          - label: 限制开发者工具
            name: blockDevTools
            widget: boolean
            required: false
            default: false
      - label: 正文
        name: body
        widget: safe-markdown
        required: true
        mdx_visual: true
        hint: 直接编辑文字和图片；导入与布局自动保留。新增图片及歌曲可用“常用组件”表单。
        fields:
          - name: component_cover
            label: 歌曲封面
            widget: image
            required: false
            media_folder: /public/assets/media
            public_folder: /assets/media
          - name: component_audio
            label: 歌曲音频
            widget: file
            required: false
            media_folder: /public/assets/media
            public_folder: /assets/media
          - name: component_image
            label: 正文图片
            widget: image
            required: false
            media_folder: ''
            public_folder: ''
    extension: mdx
  - name: pages
    label: 独立页面
    files:
      - name: about
        label: 关于我
        file: src/content/about.md
        format: yaml-frontmatter
        media_folder: ''
        public_folder: ''
        fields:
          - label: 正文
            name: body
            widget: safe-markdown
            required: true
            force_raw: true
            fields:
              - name: component_cover
                label: 歌曲封面
                widget: image
                required: false
                media_folder: /public/assets/media
                public_folder: /assets/media
              - name: component_audio
                label: 歌曲音频
                widget: file
                required: false
                media_folder: /public/assets/media
                public_folder: /assets/media
              - name: component_image
                label: 正文图片
                widget: image
                required: false
                media_folder: ''
                public_folder: ''
            hint: 可用“常用组件”表单插入图片、歌曲、提示框、公式和 Mermaid；高级语法自动使用源码编辑。
      - name: links_intro
        label: 链接页说明
        file: src/content/friends.md
        format: yaml-frontmatter
        fields:
          - label: 正文
            name: body
            widget: safe-markdown
            required: false
            fields:
              - name: component_cover
                label: 歌曲封面
                widget: image
                required: false
                media_folder: /public/assets/media
                public_folder: /assets/media
              - name: component_audio
                label: 歌曲音频
                widget: file
                required: false
                media_folder: /public/assets/media
                public_folder: /assets/media
              - name: component_image
                label: 正文图片
                widget: image
                required: false
                media_folder: ''
                public_folder: ''
            hint: 可用“常用组件”表单插入图片、歌曲、提示框、公式和 Mermaid；高级语法自动使用源码编辑。
  - name: skills
    label: 技能
    folder: src/content/skills
    create: true
    slug: '{{slug}}'
    format: json
    fields:
      - label: Name
        name: name
        widget: string
      - label: Description
        name: description
        widget: text
      - label: Icon
        name: icon
        widget: string
      - label: Category
        name: category
        widget: select
        options:
          - ai
          - backend
          - client
          - frontend
          - database
          - engines
          - tools
          - others
          - hardware
          - system
      - label: Level
        name: level
        widget: select
        options:
          - beginner
          - intermediate
          - advanced
          - expert
      - label: Experience
        name: experience
        widget: object
        fields:
          - label: Years
            name: years
            widget: number
            value_type: int
            min: 0
          - label: Months
            name: months
            widget: number
            value_type: int
            min: 0
            max: 11
      - label: Projects
        name: projects
        widget: list
        required: false
        default: []
      - label: Certifications
        name: certifications
        widget: list
        required: false
        default: []
      - label: Color
        name: color
        widget: string
        required: false
    identifier_field: name
  - name: friends
    label: 链接
    folder: src/content/friends
    create: true
    slug: '{{slug}}'
    format: json
    fields:
      - label: Title
        name: title
        widget: string
      - label: Avatar URL
        name: imgurl
        widget: string
      - label: Description
        name: desc
        widget: text
      - label: Site URL
        name: siteurl
        widget: string
      - label: Tags
        name: tags
        widget: list
        required: false
        default: []
