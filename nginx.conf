server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json application/wasm application/xml image/svg+xml;

    # Astro fingerprints these URLs, including fonts and processed images.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # These entry URLs are stable across releases; never reuse an older entry.
    location = /pagefind/pagefind.js {
        add_header Cache-Control "private, no-store";
        try_files $uri =404;
    }

    location = /pagefind/pagefind-entry.json {
        add_header Cache-Control "private, no-store";
        try_files $uri =404;
    }

    location ^~ /pagefind/ {
        # Index chunks can be stored, but should be revalidated before reuse.
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|png|jpe?g|webp|avif|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
