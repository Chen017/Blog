# 仅供隔离验证：不能直接用于生产。文件代理根目录必须是测试 fixture。
backend:
  name: github
  repo: local/audit-only
  branch: main
local_backend:
  url: http://localhost:8081/api/v1
locale: en
media_folder: public/assets/images
public_folder: /assets/images
collections:
  - name: samples
    label: Existing samples
    type: files
    files:
      - name: plain
        label: Plain article
        file: src/content/posts/to-feel-not-fight/index.md
        media_folder: ''
        public_folder: ''
        fields:
          - label: Title
            name: title
            widget: string
          - label: Directory title
            name: directoryTitle
            widget: string
            required: false
          - label: Published
            name: published
            widget: datetime
            format: YYYY-MM-DD
            date_format: YYYY-MM-DD
            time_format: false
          - label: Description
            name: description
            widget: text
            required: false
          - label: Category
            name: category
            widget: string
            required: false
          - label: Cover
            name: cover
            widget: image
            required: false
          - label: Draft
            name: draft
            widget: boolean
            default: false
            required: false
          - label: Body
            name: body
            widget: markdown
        format: yaml-frontmatter
      - name: song
        label: Song article
        file: src/content/posts/happy-new-year-2026/index.md
        media_folder: ''
        public_folder: ''
        fields:
          - label: Title
            name: title
            widget: string
          - label: Directory title
            name: directoryTitle
            widget: string
            required: false
          - label: Published
            name: published
            widget: datetime
            format: YYYY-MM-DD
            date_format: YYYY-MM-DD
            time_format: false
          - label: Description
            name: description
            widget: text
            required: false
          - label: Category
            name: category
            widget: string
            required: false
          - label: Cover
            name: cover
            widget: image
            required: false
          - label: Draft
            name: draft
            widget: boolean
            default: false
            required: false
          - label: Body
            name: body
            widget: markdown
            modes:
              - raw
        format: yaml-frontmatter
      - name: mdx
        label: MDX article
        file: src/content/posts/full-platform-music-players-cloud-local/index.mdx
        media_folder: ''
        public_folder: ''
        fields:
          - label: Title
            name: title
            widget: string
          - label: Directory title
            name: directoryTitle
            widget: string
            required: false
          - label: Published
            name: published
            widget: datetime
            format: YYYY-MM-DD
            date_format: YYYY-MM-DD
            time_format: false
          - label: Description
            name: description
            widget: text
            required: false
          - label: Category
            name: category
            widget: string
            required: false
          - label: Cover
            name: cover
            widget: image
            required: false
          - label: Draft
            name: draft
            widget: boolean
            default: false
            required: false
          - label: Body
            name: body
            widget: markdown
            modes:
              - raw
        format: yaml-frontmatter
    format: yaml-frontmatter
  - name: new_posts
    label: New bundled post
    folder: src/content/posts
    create: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    fields:
      - label: Title
        name: title
        widget: string
      - label: Directory title
        name: directoryTitle
        widget: string
        required: false
      - label: Published
        name: published
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: Description
        name: description
        widget: text
        required: false
      - label: Category
        name: category
        widget: string
        required: false
      - label: Cover
        name: cover
        widget: image
        required: false
      - label: Draft
        name: draft
        widget: boolean
        default: false
        required: false
      - label: Body
        name: body
        widget: markdown
