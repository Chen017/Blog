name: Deploy to VPS

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-vps
  queue: max

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      content-only: ${{ steps.changes.outputs.content-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: node scripts/classify-deploy.mjs

  validate:
    needs: classify
    if: needs.classify.outputs.content-only != 'true'
    uses: ./.github/workflows/validate.yml
    with:
      upload-dist: true
    secrets:
      UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}

  content-build:
    needs: classify
    if: needs.classify.outputs.content-only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: '24.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build production site
        run: pnpm build
        env:
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validated-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    needs: [classify, validate, content-build]
    if: ${{ always() && needs.classify.result == 'success' && (needs.validate.result == 'success' || needs.content-build.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false

      - name: Download the tested production site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          name: validated-dist
          path: dist

      - name: Package committed source with validated site
        run: |
          git archive --format=tar --output=site-source.tar HEAD
          tar -rf site-source.tar dist

      - name: Copy files via SCP
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSH_KEY }}
          source: "site-source.tar"
          target: "/root/Blog-incoming/${{ github.run_id }}-${{ github.run_attempt }}"
          command_timeout: 10m

      - name: Build, deploy and verify via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          OAUTH_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 25m
          envs: OAUTH_GITHUB_CLIENT_ID,OAUTH_GITHUB_CLIENT_SECRET
          script: |
            set -eu
            if ! command -v rsync >/dev/null 2>&1; then
              if [ "$(id -u)" = 0 ] && command -v apt-get >/dev/null 2>&1; then
                apt-get update -qq
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq rsync
              else
                echo 'Please install rsync on the deployment host.' >&2
                exit 1
              fi
            fi
            incoming="/root/Blog-incoming/${{ github.run_id }}-${{ github.run_attempt }}"
            test -f "$incoming/site-source.tar"
            tar -xf "$incoming/site-source.tar" -C "$incoming"
            rm -f -- "$incoming/site-source.tar"
            test -f "$incoming/package.json"
            test -s "$incoming/dist/index.html"
            mkdir -p /root/Blog
            rsync -a --delete --exclude='.env' --exclude='.git/' --exclude='node_modules/' --exclude='.astro/' --exclude='audit/' "$incoming/" /root/Blog/
            cd /root/Blog
            if [ -n "${OAUTH_GITHUB_CLIENT_ID:-}" ] && [ -n "${OAUTH_GITHUB_CLIENT_SECRET:-}" ]; then
              umask 077
              touch .env
              cms_env="$(mktemp .env.cms.XXXXXX)"
              sed '/^OAUTH_GITHUB_CLIENT_ID=/d; /^OAUTH_GITHUB_CLIENT_SECRET=/d' .env > "$cms_env"
              printf '\nOAUTH_GITHUB_CLIENT_ID=%s\nOAUTH_GITHUB_CLIENT_SECRET=%s\n' "$OAUTH_GITHUB_CLIENT_ID" "$OAUTH_GITHUB_CLIENT_SECRET" >> "$cms_env"
              mv -- "$cms_env" .env
            fi
            docker compose config --quiet
            docker compose up -d --build
            docker compose exec -T twilight-blog sh -ec '
              test -s /usr/share/nginx/html/index.html
              test -s /usr/share/nginx/html/pagefind/pagefind.js
              for attempt in 1 2 3 4 5; do
                if wget -q -O /dev/null http://127.0.0.1/; then
                  exit 0
                fi
                sleep 2
              done
              exit 1
            '
            if [ -n "${OAUTH_GITHUB_CLIENT_ID:-}" ] && [ -n "${OAUTH_GITHUB_CLIENT_SECRET:-}" ]; then
              docker compose exec -T twilight-blog sh -ec '
                for attempt in 1 2 3 4 5; do
                  if [ "$(wget -q -O - http://127.0.0.1/oauth/health)" = ready ]; then
                    exit 0
                  fi
                  sleep 2
                done
                exit 1
              '
            fi
            docker image prune -f
            docker builder prune -f --filter "until=168h"
            rm -rf -- "$incoming"
