# Personal blog configuration. Only retained features are exposed.
site:
  siteURL: https://www.etalib.space/
  title: Etalib's Space
  subtitle: Blog
  lang: en
  timeZone: 8
  font:
    misans-normal:
      src: /MiSans/woff2/MiSans-Normal.woff2
      family: MiSans
  themeColor:
    hue: 255
  wallpaper:
    mode: banner
    src:
      desktop:
        - /assets/images/desktopWallpaper.jpg
      mobile:
        - /assets/images/mobileWallpaper.jpg
    position: center
    carousel:
      enable: false
      interval: 3.6
      kenBurns: true
    banner:
      homeText:
        enable: true
        title: Etalib's Space
        subtitle:
          - Know me better through this site
        typewriter:
          enable: true
          speed: 111
          deleteSpeed: 51
          pauseTime: 3000
      credit:
        enable: false
        text: Describe
        url: ''
      navbar:
        transparentMode: semifull
      waves:
        enable: true
        performanceMode: false
    fullscreen:
      zIndex: -1
      opacity: 0.9
      blur: 1
      navbar:
        transparentMode: semi
  favicon:
    - /favicon/icon.png
  generateOgImages: false
umami:
  enabled: false
  baseUrl: ''
  apiKey: ''
  scripts: ''
navbar:
  links:
    - Home
    - Archive
    - name: Links
      url: /friends/
      icon: material-symbols:group
      description: My other websites
    - About
sidebar:
  components:
    left:
      - type: profile
        position: top
      - type: categories
        position: sticky
        responsive:
          collapseThreshold: 5
    right:
      - type: toc
        position: sticky
        customProps:
          depth: 6
      - type: statistics
        position: sticky
profile:
  avatar: /assets/images/avatar.jpg
  name: Eta Lib.
  bio: 你制造我 毁灭我 背对所有灯火
  links:
    - name: GitHub
      icon: fa6-brands:github
      url: https://github.com/Chen017
post:
  showLastModified: true
  card:
    cover:
      side: left
      width: 33%
      showContent: true
      showDefaultCover: true
    titleSize: text-2xl
  expressiveCode:
    theme: github-dark
  comment:
    enable: false
    provider: twikoo
    waline:
      serverURL: ''
      lang: ''
    twikoo:
      envId: https://twikoo.vercel.app
      lang: en
particle:
  enable: true
  particleNum: 12
  limitTimes: -1
  size:
    min: 0.3
    max: 0.9
  opacity:
    min: 0.3
    max: 0.9
  speed:
    horizontal:
      min: -0.9
      max: 0.9
    vertical:
      min: 0.15
      max: 0.3
    rotation: 0.12
    fadeSpeed: 0.12
  zIndex: 100
